<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shipping Lanes Launcher</title>
<style>
:root{color-scheme:dark;font:16px/1.5 system-ui,sans-serif;--navy:#101d40;--panel:#162955;--line:#365387;--white:#fff7df;--muted:#c4d6f5;--gold:#ffcf54}
*{box-sizing:border-box}[hidden]{display:none!important}
body{min-height:100vh;margin:0;padding:1rem;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 0,#234d9c,#07132e 76%);color:var(--white)}
main{width:min(100%,680px);background:var(--navy);border:1px solid var(--line);border-radius:24px;overflow:hidden;box-shadow:0 28px 90px #040a1a99}
.masthead{text-align:center;padding:2.25rem 1.5rem 1.4rem;background:linear-gradient(160deg,#095ad6,#07348f);border-bottom:3px solid #59acff}
.masthead img{display:block;width:min(100%,420px);margin:auto}
.masthead h1{font:700 1.08rem Georgia,serif;letter-spacing:.12em;text-transform:uppercase;margin:1.05rem 0 0}
.panel{padding:clamp(1.2rem,4vw,2.3rem)}.status{margin:0 0 .22rem;font-weight:650;font-size:1.12rem;color:#fff7e0}
.version{display:block;min-height:1.4em;color:var(--muted)}.actions{display:flex;align-items:center;flex-wrap:wrap;gap:.65rem;margin:1.05rem 0 1.2rem}
button{font:600 .96rem/1.25 system-ui,sans-serif;padding:.7em .95em;min-height:42px;border:1px solid #6d96d5;border-radius:10px;background:#203e73;color:var(--white);cursor:pointer}
button:hover{background:#2c518c}button:disabled{opacity:.55;cursor:default}button:focus-visible{outline:3px solid #a0d8ff;outline-offset:3px}
#play,#install{font-weight:750;background:var(--gold);color:#17264c;border-color:#ffe49e}
#play:hover:not(:disabled),#install:hover{background:#ffe292}progress{margin-top:.5rem;width:100%;height:13px;accent-color:var(--gold)}
footer{display:flex;gap:.8rem;align-items:center;justify-content:space-between;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:1.15rem}
footer p{margin:0 0 .55rem;color:var(--muted);font-size:.89rem}#quit{background:transparent}
</style>
<main>
<header class="masthead">
  <img src="data:image/webp;base64,{{LAUNCHER_LOGO}}" alt="Shipping Lanes">
  <h1>Game Launcher</h1>
</header>
<section class="panel" aria-label="Game installation and account">
  <p class="status" id="status" role="status">Checking for the latest game build…</p>
  <small class="version" id="versions"></small>
  <progress id="progress" max="100" hidden aria-label="Game download progress"></progress>
  <div class="actions">
    <button id="install" type="button" hidden>Download game</button>
    <button id="play" type="button" hidden>Play</button>
    <button id="check" type="button" disabled>Check for updates</button>
  </div>
  <footer>
    <div>
      <p id="profile" aria-live="polite">Sign in to play.</p>
      <button id="signin" type="button">Sign in or create an account</button>
      <button id="signout" type="button" hidden>Sign out</button>
    </div>
    <button id="quit" type="button">Quit launcher</button>
  </footer>
</section>
</main>
<script>
const elements = Object.fromEntries(['status','versions','progress','install','play','check','quit','signin','signout','profile'].map(id => [id, document.getElementById(id)]));
let closed = false;
async function refresh() {
  if (closed) return;
  try {
    const response = await fetch('status');
    if (!response.ok) throw new Error();
    const state = await response.json();
    if (elements.status.textContent !== state.message) elements.status.textContent = state.message;
    elements.versions.textContent = [state.installed && 'Installed ' + state.installed, state.available && 'Latest ' + state.available].filter(Boolean).join(' · ');
    elements.progress.hidden = !state.busy || state.progress === 0;
    elements.progress.value = state.progress;
    elements.install.hidden = !state.canInstall;
    elements.install.textContent = state.installed ? 'Download update' : 'Download game';
    elements.play.hidden = !state.installed;
    elements.play.disabled = !state.username;
    const profile = state.username ? 'Signed in as ' + state.username : 'Sign in to play.';
    if (elements.profile.textContent !== profile) elements.profile.textContent = profile;
    elements.signin.hidden = !!state.username;
    elements.signout.hidden = !state.username;
    elements.check.disabled = state.busy;
  } catch {
    elements.status.textContent = 'The launcher has closed. Reopen it to continue.';
  }
}
async function action(name) {
  try {
    const response = await fetch(name, {method:'POST'});
    if (!response.ok) throw new Error();
    if (name === 'quit') {
      closed = true;
      elements.status.textContent = 'Launcher closed. You can close this tab.';
      document.querySelectorAll('button').forEach(button => button.disabled = true);
      return;
    }
    await refresh();
  } catch {
    elements.status.textContent = 'Could not complete this action. Try again.';
  }
}
for (const name of ['check','install','play','quit','signin','signout']) elements[name].addEventListener('click', () => action(name));
refresh();
setInterval(refresh, 700);
</script>
</html>
